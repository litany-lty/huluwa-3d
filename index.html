<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>葫芦兄弟 · 立体宣纸微缩剧场</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="viewport">
    <canvas id="webgl-canvas"></canvas>

    <!-- Poetic Act Title Card -->
    <div id="act-card" aria-live="polite">
      <span id="act-numeral">壹</span>
      <span class="act-divider" aria-hidden="true"></span>
      <div class="act-titles">
        <span id="act-title">神峰惊变·仙藤结子</span>
        <span id="act-title-en">The Broken Seal &amp; The Sacred Vine</span>
      </div>
    </div>

    <!-- Bilingual Story Caption -->
    <div id="subtitle-bar" class="hidden" aria-live="polite">
      <div id="subtitle-zh" class="sub-zh"></div>
      <div id="subtitle-en" class="sub-en"></div>
    </div>

    <!-- Title sequence & end credits (driven by timeline, no clutter) -->
    <div id="veil" aria-hidden="true"></div>
    <div id="opening" aria-hidden="true">
      <div class="op-gourds"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <h2 class="op-title">葫芦兄弟</h2>
      <div class="op-sub">CALABASH BROTHERS</div>
      <div class="op-tribute">致敬 · 上海美术电影制片厂 1986</div>
    </div>
    <div id="ending" aria-hidden="true">
      <div id="credits-roll">
        <div class="cr-title">葫芦兄弟<span>CALABASH BROTHERS</span></div>
        <div class="cr-line"><b>致敬原作</b>上海美术电影制片厂《葫芦兄弟》(1986)</div>
        <div class="cr-line"><b>主题曲</b>《葫芦娃》旋律改编 · 国风器乐版<br />片尾升调再现</div>
        <div class="cr-line"><b>造型</b>86 版剪纸角色与法宝重绘</div>
        <div class="cr-line"><b>画面</b>Three.js 立体宣纸皮影剧场</div>
        <div class="cr-line cr-note">非商业粉丝致敬短片</div>
      </div>
      <div id="end-mark">终<span>THE END</span></div>
    </div>

    <!-- Opening Xuan-Paper Curtain -->
    <div id="intro-curtain">
      <div class="curtain-emblem">
        <div class="gourd-crest" aria-hidden="true">
          <svg viewBox="0 0 64 96" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M32 6C34 11 33 15 32 18C24 19 20 26 22 35C23 41 27 44 27 47C27 51 17 56 16 69C15 82 23 90 32 90C41 90 49 82 48 69C47 56 37 51 37 47C37 44 41 41 42 35C44 26 40 19 32 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M27 11C31 7 37 7 41 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="film-title">葫芦兄弟</h1>
        <button id="btn-start" type="button" aria-label="播放">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5.2v13.6L19 12 8 5.2z" />
          </svg>
        </button>
        <div class="load-track" aria-hidden="true">
          <div id="load-progress"></div>
        </div>
      </div>
    </div>

    <!-- Floating Minimal Cinema Control Bar -->
    <div id="cinema-bar" role="region" aria-label="播放控制">
      <button id="btn-play" class="icon-btn" type="button" aria-label="播放 / 暂停">
        <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M7.5 5.2v13.6L18.5 12 7.5 5.2z" />
        </svg>
        <svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="6.5" y="5" width="4" height="14" rx="1" />
          <rect x="13.5" y="5" width="4" height="14" rx="1" />
        </svg>
      </button>

      <div id="timeline-track" role="slider" aria-label="时间轴" aria-valuemin="0" aria-valuemax="292" aria-valuenow="0" tabindex="0">
        <div id="timeline-fill"></div>
        <div id="chapter-dots"></div>
        <div id="timeline-thumb"></div>
      </div>

      <span id="time-readout">0:00 / 4:52</span>

      <button id="btn-camera" class="icon-btn" type="button" aria-label="切换镜头视角">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h8A2.5 2.5 0 0 1 16 8.5v7a2.5 2.5 0 0 1-2.5 2.5h-8A2.5 2.5 0 0 1 3 15.5v-7z" />
          <path d="M16 10.2l5-3.2v10l-5-3.2v-3.6z" />
        </svg>
      </button>

      <button id="btn-mute" class="icon-btn" type="button" aria-label="静音开关">
        <svg class="ico-vol-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5.5L6.5 9.2H3.5v5.6h3L11 18.5V5.5z" />
          <path d="M15.2 8.8a4.6 4.6 0 0 1 0 6.4" />
          <path d="M18 6.2a8.2 8.2 0 0 1 0 11.6" />
        </svg>
        <svg class="ico-vol-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5.5L6.5 9.2H3.5v5.6h3L11 18.5V5.5z" />
          <path d="M15.5 9.5l5 5M20.5 9.5l-5 5" />
        </svg>
      </button>
    </div>
  </div>

  <script>
    if (new URLSearchParams(window.location.search).get('autostart') === '1') {
      var curtain = document.getElementById('intro-curtain');
      if (curtain) curtain.classList.add('hidden');
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
